<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ABKI BAAR AWASTHI JI KI SARKAAR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-image: url('https://images.unsplash.com/photo-1557682250-33bd709cbe85?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxleHBsb3JlLWZlZWR8Mnx8fGVufDB8fHx8fA%3D%3D&w=1000&q=80');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #2c1810;
      font-family: Algerian, sans-serif;
      text-align: center;
      margin: 0;
      min-height: 100vh;
    }
    #helpDeskBtn {
        position: fixed;
        bottom: 24px;
        left: 24px;
        background: #4b2785;
        color: #fff;
        padding: 12px 18px;
        border-radius: 24px;
        font-family: Algerian, sans-serif;
        font-size: 1em;
        cursor: pointer;
        box-shadow: 0 2px 8px #0002;
        z-index: 1000;
        transition: background 0.3s, transform 0.2s;
    }
    #helpDeskBtn:hover { background: #6b3db8; transform: scale(1.07);}
    #helpDeskPopup {
         position: fixed;
         bottom: 70px; left: 24px;
        background: #fff;
        color: #2c1810;
        border-radius: 14px;
        box-shadow: 0 4px 16px #0003;
        padding: 16px 24px;
        z-index: 1001;
        min-width: 220px;
        animation: fadeIn 0.5s;
    }
    .hide { display: none; }
    .message {
        opacity: 0;
        transition: opacity 0.4s;
    }
    .message.show {
      opacity: 1;
    }
    #langSwitcher {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 1000;
    }
    #langSwitcher button {
         background: #fff;
         color: #4b2785;
         border: 2px solid #4b2785;
         border-radius: 8px;
         margin-left: 6px;
         padding: 4px 12px;
         font-family: Algerian, sans-serif;
         font-size: 1em;
         cursor: pointer;
         transition: background 0.3s, color 0.3s;
    }
    #langSwitcher button.active, #langSwitcher button:hover {
        background: #4b2785;
        color: #fff;
    }
    .container {
      background: rgba(255,255,255,0.92);
      max-width: 340px;
      margin: 40px auto;
      border-radius: 12px;
      box-shadow: 0 4px 16px #0002;
      padding: 30px 18px;
      text-align: center;
      animation: fadeIn 1s;
    }
    h1 {
      color: #f5e6e6;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      font-size: 2em;
      margin-top: 30px;
      margin-bottom: 0;
      animation: popIn 2s;
    }
    label {
      display: block;
      margin: 16px 0 6px;
      text-align: left;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 7px 10px;
      margin-bottom: 10px;
      border: 2px solid #4b2785;
      border-radius: 5px;
      font-family: Algerian, sans-serif;
      background: #fff;
      font-size: 1em;
      box-sizing: border-box;
    }
    button {
      padding: 8px 20px;
      border: none;
      background: #4b2785;
      color: #fff;
      border-radius: 5px;
      font-family: Algerian, sans-serif;
      font-size: 1em;
      cursor: pointer;
      margin: 8px 0;
      transition: background 0.2s;
    }
    button.secondary { background: #007BFF; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    .error { color: #d32f2f; margin-bottom: 10px; }
    .success { color: #388e3c; margin-bottom: 10px; }
    .hide { display: none; }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.5);}
      50% { opacity: 1; transform: scale(1.2);}
      100% { transform: scale(1);}
    }
    @keyframes bounceIn {
         0% { transform: scale(0.3); opacity: 0;}
        50% { transform: scale(1.1); opacity: 1;}
        100% { transform: scale(1);}
    }
  </style>
</head>
<body>
  <h1>SAGE Voting Portal</h1>
  <div id="helpDeskBtn" title="Need Help?">🆘 Help Desk</div>
  <div id="helpDeskPopup" class="hide">
  <div>
    <strong id="helpDeskTitle">Need Help?</strong>
    <p id="helpDeskText">Contact us at <a href="mailto:support@example.com">sachi30072006@gmail.com</a><br>
    or scan the QR code below:</p>
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=Support" alt="Help QR" style="margin:10px 0;">
    <button onclick="closeHelpDesk()">Close</button>
  </div>
  </div
  <div id="langSwitcher">
    <button onclick="setLang('en')" id="btnEn">English</button>
    <button onclick="setLang('hi')" id="btnHi">हिन्दी</button>
  </div>
  <!-- Registration -->
  <div class="container" id="registerBox">
    <h2>Register</h2>
    <div class="error" id="registerError"></div>
    <label for="regEnroll">Your Enrollment Number:</label>
    <input type="text" id="regEnroll" placeholder="Enter your enrollment number" required>
    <label for="regPass">Create Password:</label>
    <input type="password" id="regPass" placeholder="Create a password" required>
    <button onclick="register()">Register</button>
    <button class="secondary" onclick="showLogin()">Already have an account?</button>
  </div>
  <!-- Login -->
  <div class="container hide" id="loginBox">
    <h2>Login</h2>
    <div class="error" id="loginError"></div>
    <label for="loginEnroll">Your Enrollment Number:</label>
    <input type="text" id="loginEnroll" placeholder="Enter your enrollment number" required>
    <label for="loginPass">Password:</label>
    <input type="password" id="loginPass" placeholder="Enter your password" required>
    <button onclick="login()">Login</button>
    <button class="secondary" onclick="showRegister()">Create a new account</button>
  </div>
  <!-- Voting -->
  <div class="container hide" id="voteBox">
    <h2>Vote</h2>
    <div class="success" id="voteMsg"></div>
    <label for="fullName">Enter Your Full Name:</label>
    <input type="text" id="fullName" placeholder="Enter your full name" required>
    <label for="enrollmentNumber">Enrollment Number:</label>
    <input type="text" id="enrollmentNumber" readonly>
    <label for="candidate">Choose a Candidate:</label>
    <select id="candidate" required>
      <option value="">Select a candidate</option>
      <option value="candidate1">👩‍💼 SNEHA SINGH</option>
      <option value="candidate2">👨‍💼 YASH AWASTHI</option>
      <option value="candidate3">👩‍💼 SACHI MISHRA</option>
      <option value="candidate4">👨‍💼 SURYANSH GOUR</option>
    </select>
    <button onclick="submitVote()">Submit Vote</button>
    <button class="secondary" onclick="logout()">Logout</button>
  </div>
  <div id="voteSuccess" style="display:none;font-size:2em;animation:bounceIn 1s;">✅ Thank you for voting!</div>
  <script>
    const translations = {
        en: {
            register: "Register",
            login: "Login",
            vote: "Vote",
            'Your Enrollment Number:': "Your Enrollment Number:",
            'Create Password:': "Create Password:",
            'Already have an account?': "Already have an account?",
            'Enter Your Full Name:': "Enter Your Full Name:",
            'Choose a Candidate:': "Choose a Candidate:",
            'Submit Vote': "Submit Vote",
            'Logout': "Logout",
            'Need Help?': "Need Help?",
            'Contact us at': "Contact us at",
            'or scan the QR code below:': "or scan the QR code below:"
        },
        hi: {
            register: "रजिस्टर करें",
            login: "लॉगिन",
            vote: "मतदान करें",
            'Your Enrollment Number:': "आपका नामांकन नंबर:",
            'Create Password:': "पासवर्ड बनाएं:",
            'Already have an account?': "पहले से खाता है?",
            'Enter Your Full Name:': "अपना पूरा नाम दर्ज करें:",
            'Choose a Candidate:': "उम्मीदवार चुनें:",
            'Submit Vote': "वोट जमा करें",
            'Logout': "लॉगआउट",
            'Need Help?': "मदद चाहिए?",
            'Contact us at': "हमसे संपर्क करें",
            'or scan the QR code below:': "या नीचे दिए गए QR कोड को स्कैन करें:"
        }
    };
    let currentLang = 'en';
    function setLang(lang) {
        currentLang = lang;
        document.getElementById('btnEn').classList.toggle('active', lang === 'en');
        document.getElementById('btnHi').classList.toggle('active', lang === 'hi');
        // Update texts
        document.querySelector('#registerBox h2').textContent = translations[lang].register;
        document.querySelector('#loginBox h2').textContent = translations[lang].login;
        document.querySelector('#voteBox h2').textContent = translations[lang].vote;
        document.querySelector("label[for='regEnroll']").textContent = translations[lang]['Your Enrollment Number:'];
        document.querySelector("label[for='regPass']").textContent = translations[lang]['Create Password:'];
        document.querySelector("#registerBox button.secondary").textContent = translations[lang]['Already have an account?'];
        document.querySelector("label[for='fullName']").textContent = translations[lang]['Enter Your Full Name:'];
        document.querySelector("label[for='candidate']").textContent = translations[lang]['Choose a Candidate:'];
        document.querySelector("#voteBox button").textContent = translations[lang]['Submit Vote'];
        document.querySelector("#voteBox button.secondary").textContent = translations[lang]['Logout'];
        document.getElementById('helpDeskTitle').textContent = translations[lang]['Need Help?'];
        document.getElementById('helpDeskText').innerHTML = translations[lang]['Contact us at'] + ' <a href="mailto:support@example.com">support@example.com</a><br>' +
        translations[lang]['or scan the QR code below:'];
    }
    window.onload = function() {
        setLang('en');
    };
    document.getElementById('helpDeskBtn').onclick = function() {
    document.getElementById('helpDeskPopup').classList.remove('hide');
    };
    function closeHelpDesk() {
      document.getElementById('helpDeskPopup').classList.add('hide');
    }
    // Show Register/Login/Vote sections
    function showRegister() {
      document.getElementById('registerBox').classList.remove('hide');
      document.getElementById('loginBox').classList.add('hide');
      document.getElementById('voteBox').classList.add('hide');
      document.getElementById('registerError').textContent = '';
    }
    function showLogin() {
      document.getElementById('registerBox').classList.add('hide');
      document.getElementById('loginBox').classList.remove('hide');
      document.getElementById('voteBox').classList.add('hide');
      document.getElementById('loginError').textContent = '';
    }
    function showVoteBox() {
      document.getElementById('registerBox').classList.add('hide');
      document.getElementById('loginBox').classList.add('hide');
      document.getElementById('voteBox').classList.remove('hide');
      document.getElementById('voteMsg').textContent = '';
      // Autofill enrollment number
      document.getElementById('enrollmentNumber').value = sessionStorage.getItem('currentUser') || '';
      document.getElementById('fullName').value = '';
      document.getElementById('candidate').value = '';
    }
    // Registration logic
    function register() {
      const enroll = document.getElementById('regEnroll').value.trim();
      const pass = document.getElementById('regPass').value;
      const errorDiv = document.getElementById('registerError');
      if (!enroll || !pass) {
        errorDiv.textContent = "Please fill all fields.";
        return;
      }
      let users = JSON.parse(localStorage.getItem('users') || '{}');
      if (users[enroll]) {
        errorDiv.textContent = "Enrollment already registered. Please login.";
        return;
      }
      users[enroll] = { password: pass };
      localStorage.setItem('users', JSON.stringify(users));
      errorDiv.textContent = "";
      alert("Registration successful! Please login.");
      showLogin();
    }
    // Login logic
    function login() {
      const enroll = document.getElementById('loginEnroll').value.trim();
      const pass = document.getElementById('loginPass').value;
      const errorDiv = document.getElementById('loginError');
      let users = JSON.parse(localStorage.getItem('users') || '{}');
      if (!users[enroll] || users[enroll].password !== pass) {
        errorDiv.textContent = "Invalid credentials.";
        return;
      }
      sessionStorage.setItem('currentUser', enroll);
      errorDiv.textContent = "";
      showVoteBox();
    }
    // Voting logic (one vote per user)
    function submitVote() {
      const fullName = document.getElementById('fullName').value.trim();
      const candidate = document.getElementById('candidate').value;
      const enroll = sessionStorage.getItem('currentUser');
      const msgDiv = document.getElementById('voteMsg');
      if (!fullName || !candidate) {
        msgDiv.textContent = "Please fill all fields.";
        msgDiv.style.color = "#d32f2f";
        return;
      }
      let votes = JSON.parse(localStorage.getItem('votes') || '{}');
      if (votes[enroll]) {
        msgDiv.textContent = "You have already voted! Only one vote allowed.";
        msgDiv.style.color = "#d32f2f";
        return;
      }
      votes[enroll] = { name: fullName, candidate: candidate };
      localStorage.setItem('votes', JSON.stringify(votes));
      msgDiv.textContent = "Thank you! Your vote has been recorded.";
      msgDiv.style.color = "#388e3c";
    }
    function logout() {
      sessionStorage.removeItem('currentUser');
      showLogin();
    }
    // On page load, show login if users exist, else registration
    window.onload = function() {
      let users = JSON.parse(localStorage.getItem('users') || '{}');
      if (Object.keys(users).length > 0) {
        showLogin();
      } else {
        showRegister();
      }
    };
    function showSection(id) {
        document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
  </script>
</body>
</html>
